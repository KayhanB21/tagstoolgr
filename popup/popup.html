<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TagsToolGR</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><h1>TagsToolGR</h1><p id="selection">Loading selected messages…</p></header>
<form id="form">
<fieldset id="controls" disabled>
<legend>Choose tags</legend>
<div id="tags" class="tags"></div>
<p id="empty" hidden>Create tags in Thunderbird’s Settings → General → Tags, then reopen this window.</p>
<label class="mode" for="mode">When applying</label>
<select id="mode"><option value="add">Add to existing tags</option><option value="replace">Replace all existing tags</option></select>
<p id="hint">Existing tags will be kept.</p>
<footer><button id="clear" type="button">Clear all tags</button><button id="apply" type="submit" class="primary" disabled>Apply tags</button></footer>
</fieldset>
</form>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="popup.js"></script>
</body></html>
